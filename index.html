<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>AlteOS 7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop" class="desktop">
    <section class="welcome" aria-label="AlteOS 7">
      <div class="brand-mark">A7</div>
      <h1>AlteOS 7</h1>
      <p>Un espace de travail moderne, directement dans votre navigateur.</p>
    </section>

    <div id="desktopIcons" class="desktop-icons"></div>

    <div id="startMenu" class="start-menu hidden">
      <div class="start-header">
        <div class="user-avatar">A</div>
        <div><strong>AlteOS User</strong><span>AlteOS 7</span></div>
      </div>
      <div class="search-box"><span>⌕</span><input id="appSearch" type="search" placeholder="Rechercher une application..."></div>
      <div id="categoryTabs" class="category-tabs"></div>
      <div id="appGrid" class="app-grid"></div>
    </div>

    <div id="windowLayer" class="window-layer"></div>

    <footer class="taskbar">
      <button id="startButton" class="taskbar-button start-button" aria-label="Menu Démarrer">⊞</button>
      <div id="taskbarApps" class="taskbar-apps"></div>
      <div class="system-tray">
        <span id="networkStatus">◉</span><span>▮▮</span><span id="clock">00:00</span>
      </div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
